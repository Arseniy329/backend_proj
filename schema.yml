        description: A unique integer value identifying this Гілка.
        required: true
      tags:
      - branches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BranchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BranchRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
          description: ''
    patch:
      operationId: branches_partial_update
      description: |-
        ViewSet для CRUD-операцій з філіями (Branch).

        - GET    /api/branches/          — список активних філій (адміни бачать усі)
        - POST   /api/branches/          — створити нову філію
        - GET    /api/branches/{id}/     — деталі філії
        - PUT    /api/branches/{id}/     — повне оновлення
        - PATCH  /api/branches/{id}/     — часткове оновлення
        - DELETE /api/branches/{id}/     — м'яке видалення (архівування)
        - POST   /api/branches/{id}/restore/ — відновлення з архіву
      parameters:
