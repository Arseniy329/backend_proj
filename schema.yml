          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AttendanceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttendanceRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attendance'
          description: ''
    patch:
      operationId: attendances_partial_update
      description: |-
        ViewSet для CRUD-операцій з відвідуваністю (Attendance).

        - GET    /api/attendances/              — список записів відвідуваності
        - POST   /api/attendances/              — створити запис
        - GET    /api/attendances/{id}/         — деталі запису
        - PUT    /api/attendances/{id}/         — повне оновлення
        - PATCH  /api/attendances/{id}/         — часткове оновлення (напр. зміна статусу)
        - DELETE /api/attendances/{id}/         — видалити запис

        Фільтрація (query params):
        - ?lesson=1          — за заняттям
        - ?student=2         — за студентом
        - ?status=present    — за статусом
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Відвідування.
        required: true
      tags:
      - attendances
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAttendanceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAttendanceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAttendanceRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attendance'
          description: ''
    delete:
      operationId: attendances_destroy
      description: |-
        ViewSet для CRUD-операцій з відвідуваністю (Attendance).

        - GET    /api/attendances/              — список записів відвідуваності
        - POST   /api/attendances/              — створити запис
        - GET    /api/attendances/{id}/         — деталі запису
        - PUT    /api/attendances/{id}/         — повне оновлення
        - PATCH  /api/attendances/{id}/         — часткове оновлення (напр. зміна статусу)
        - DELETE /api/attendances/{id}/         — видалити запис

        Фільтрація (query params):
        - ?lesson=1          — за заняттям
        - ?student=2         — за студентом
        - ?status=present    — за статусом
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Відвідування.
        required: true
      tags:
      - attendances
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Вхід користувача за номером телефону та паролем.

        POST /api/auth/login/
        Body: { "phone": "+380991234567", "password": "secret" }

        Відповідь:
        {
            "access": "<access-token>",
            "refresh": "<refresh-token>",
            "user": { "id", "phone", "full_name", "role" }
        }

        Безпека:
        - Неактивні (архівовані) користувачі отримують зрозуміле повідомлення.
        - При невірних реквізитах — уніфікована помилка (не розкриваємо деталі).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PhoneLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PhoneLoginRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneLogin'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Logout'
          description: ''
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Оновлення access-токена за допомогою refresh-токена.

        POST /api/auth/refresh/
        Body: { "refresh": "<refresh-token>" }

        Відповідь: { "access": "<новий-access>", "refresh": "<новий-refresh>" }

        Ротація:
        - Після кожного запиту старий refresh-токен анулюється (blacklist).
        - Видається новий refresh-токен (одноразове використання).
        - Налаштовується через SIMPLE_JWT: ROTATE_REFRESH_TOKENS=True,
          BLACKLIST_AFTER_ROTATION=True.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/branches/:
    get:
