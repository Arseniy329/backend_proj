openapi: 3.0.3
info:
  title: Education Platform — Phase 2 API
  version: 2.0.0
  description: REST API для управління філіями, предметами, групами, абонементами,
    заняттями та відвідуваністю. Авторизація через JWT (Bearer token).
paths:
  /api/attendances/:
    get:
      operationId: attendances_list
      description: |-
        ViewSet для CRUD-операцій з відвідуваністю (Attendance).

        - GET    /api/attendances/              — список записів відвідуваності
        - POST   /api/attendances/              — створити запис
        - GET    /api/attendances/{id}/         — деталі запису
        - PUT    /api/attendances/{id}/         — повне оновлення
        - PATCH  /api/attendances/{id}/         — часткове оновлення (напр. зміна статусу)
        - DELETE /api/attendances/{id}/         — видалити запис

        Фільтрація (query params):
        - ?lesson=1          — за заняттям
        - ?student=2         — за студентом
        - ?status=present    — за статусом
      parameters:
      - in: query
        name: lesson
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          title: Статус
          enum:
          - absent
          - late
          - present
        description: |-
          * `present` - Присутній
          * `absent` - Відсутній
          * `late` - Запізнився
      - in: query
        name: student
        schema:
          type: integer
      tags:
      - attendances
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attendance'
          description: ''
    post:
      operationId: attendances_create
      description: |-
        ViewSet для CRUD-операцій з відвідуваністю (Attendance).

        - GET    /api/attendances/              — список записів відвідуваності
        - POST   /api/attendances/              — створити запис
        - GET    /api/attendances/{id}/         — деталі запису
        - PUT    /api/attendances/{id}/         — повне оновлення
        - PATCH  /api/attendances/{id}/         — часткове оновлення (напр. зміна статусу)
        - DELETE /api/attendances/{id}/         — видалити запис

        Фільтрація (query params):
        - ?lesson=1          — за заняттям
        - ?student=2         — за студентом
        - ?status=present    — за статусом
      tags:
      - attendances
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AttendanceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttendanceRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attendance'
          description: ''
  /api/attendances/{id}/:
