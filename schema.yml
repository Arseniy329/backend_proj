        - ?status=present    — за статусом
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Відвідування.
        required: true
      tags:
      - attendances
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
