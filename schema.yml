  /api/groups/:
    get:
      operationId: groups_list
      description: |-
        ViewSet для CRUD-операцій з групами (Group).

        - GET    /api/groups/              — список груп (з фільтрацією)
        - POST   /api/groups/              — створити нову групу
        - GET    /api/groups/{id}/         — деталі групи
        - PUT    /api/groups/{id}/         — повне оновлення
        - PATCH  /api/groups/{id}/         — часткове оновлення
        - DELETE /api/groups/{id}/         — деактивація групи (status → inactive)

        Фільтрація (query params):
        - ?branch=1          — за філією
        - ?status=active     — за статусом
        - ?search=Група      — пошук за назвою
      parameters:
      - in: query
        name: branch
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          title: Статус
          enum:
          - active
          - inactive
        description: |-
          * `active` - Активна
          * `inactive` - Неактивна
      tags:
      - groups
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
          description: ''
    post:
      operationId: groups_create
      description: |-
        ViewSet для CRUD-операцій з групами (Group).

        - GET    /api/groups/              — список груп (з фільтрацією)
        - POST   /api/groups/              — створити нову групу
        - GET    /api/groups/{id}/         — деталі групи
        - PUT    /api/groups/{id}/         — повне оновлення
        - PATCH  /api/groups/{id}/         — часткове оновлення
        - DELETE /api/groups/{id}/         — деактивація групи (status → inactive)

        Фільтрація (query params):
        - ?branch=1          — за філією
        - ?status=active     — за статусом
        - ?search=Група      — пошук за назвою
      tags:
      - groups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GroupRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GroupRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
          description: ''
  /api/groups/{id}/:
    get:
      operationId: groups_retrieve
