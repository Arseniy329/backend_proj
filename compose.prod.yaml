# compose.prod.yaml — Production Docker Compose stack
# Usage: docker compose -f compose.prod.yaml up -d --build
#
# Prerequisites:
#   - Create an .env.prod file in the same directory (see .env.prod.example)
#   - Never commit .env.prod to version control

services:

  # ── PostgreSQL 17 ────────────────────────────────────────────────────────────
  db:
    image: postgres:17
    restart: unless-stopped
    env_file: .env.prod          # reads POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Django + Gunicorn ────────────────────────────────────────────────────────
  web:
    build:
      context: ./education_plat   # directory that contains the Dockerfile
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.prod
    # No bind-mount volumes — the image is the single source of truth for code.
    depends_on:
      db:
        condition: service_healthy
    # Run migrations automatically on every (re)start before Gunicorn takes over
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn education_plat.wsgi:application
               --bind 0.0.0.0:8000
               --workers 3
               --timeout 30"

  # ── Nginx 1.27 reverse proxy ─────────────────────────────────────────────────
  nginx:
    image: nginx:1.27
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro   # read-only mount
    depends_on:
      - web

volumes:
  postgres_data:
