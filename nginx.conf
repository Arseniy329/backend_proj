# nginx.conf — Nginx reverse proxy configuration for the production stack
# Placed at: /etc/nginx/conf.d/default.conf (mounted read-only by compose.prod.yaml)

server {
    listen 80;

    # ── Performance & safety ────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;

    # Limit upload body size (file attachments, etc.)
    client_max_body_size 10M;

    # ── Proxy to Gunicorn ───────────────────────────────────────────────────────
    location / {
        proxy_pass         http://web:8000;

        # Standard forwarded-for headers consumed by Django's
        # SECURE_PROXY_SSL_HEADER and REMOTE_ADDR
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Prevent Nginx from buffering slow Gunicorn responses
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }
}
