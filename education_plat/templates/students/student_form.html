{% extends "base.html" %}

{% block title %}{{ action }} студента — EduPlatform{% endblock %}
{% block page_title %}{{ action }} студента{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px;">
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="first_name">Ім'я</label>
            <input type="text" id="first_name" name="first_name" class="form-control"
                   value="{{ student.first_name|default:'' }}" required>
        </div>
        <div class="form-group">
            <label for="last_name">Прізвище</label>
            <input type="text" id="last_name" name="last_name" class="form-control"
                   value="{{ student.last_name|default:'' }}" required>
        </div>
        <div class="form-group">
            <label for="phone">Телефон</label>
            <input type="text" id="phone" name="phone" class="form-control"
                   value="{{ student.phone|default:'' }}">
        </div>
        <div class="form-group">
            <label for="date_of_birth">Дата народження</label>
            <input type="date" id="date_of_birth" name="date_of_birth" class="form-control"
                   value="{{ student.date_of_birth|date:'Y-m-d'|default:'' }}">
        </div>
        <div class="form-group">
            <label for="branch">Гілка</label>
            <select id="branch" name="branch" class="form-control">
                <option value="">— Не вказано —</option>
                {% for b in branches %}
                <option value="{{ b.pk }}" {% if student and student.branch_id == b.pk %}selected{% endif %}>{{ b.name }}</option>
                {% endfor %}
            </select>
        </div>

        <h3 style="margin: 24px 0 16px; font-size: 16px;">Контакти батьків</h3>

        <div class="form-group">
            <label for="parent_name">ПІБ батьків</label>
            <input type="text" id="parent_name" name="parent_name" class="form-control"
                   value="{{ student.parent_name|default:'' }}">
        </div>
        <div class="form-group">
            <label for="parent_phone">Телефон батьків</label>
            <input type="text" id="parent_phone" name="parent_phone" class="form-control"
                   value="{{ student.parent_phone|default:'' }}">
        </div>
        <div class="form-group">
            <label for="parent_email">Email батьків</label>
            <input type="email" id="parent_email" name="parent_email" class="form-control"
                   value="{{ student.parent_email|default:'' }}">
        </div>

        <div style="display:flex; gap:12px;">
            <button type="submit" class="btn btn-primary">{{ action }}</button>
            <a href="{% url 'student_list' %}" class="btn btn-outline">Скасувати</a>
        </div>
    </form>
</div>
{% endblock %}
