{% extends "base.html" %}

{% block title %}{{ action }} групу — EduPlatform{% endblock %}
{% block page_title %}{{ action }} групу{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px;">
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="name">Назва</label>
            <input type="text" id="name" name="name" class="form-control"
                   value="{{ group.name|default:'' }}" required>
        </div>
        <div class="form-group">
            <label for="branch">Гілка</label>
            <select id="branch" name="branch" class="form-control" required>
                <option value="">Оберіть гілку</option>
                {% for b in branches %}
                <option value="{{ b.pk }}" {% if group and group.branch_id == b.pk %}selected{% endif %}>{{ b.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="subject">Предмет</label>
            <select id="subject" name="subject" class="form-control" required>
                <option value="">Оберіть предмет</option>
                {% for s in subjects %}
                <option value="{{ s.pk }}" {% if group and group.subject_id == s.pk %}selected{% endif %}>{{ s.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="teacher">Викладач</label>
            <select id="teacher" name="teacher" class="form-control">
                <option value="">— Не вказано —</option>
                {% for t in teachers %}
                <option value="{{ t.pk }}" {% if group and group.teacher_id == t.pk %}selected{% endif %}>{{ t.first_name }} {{ t.last_name }}</option>
                {% endfor %}
            </select>
        </div>
        <div style="display:flex; gap:12px;">
            <button type="submit" class="btn btn-primary">{{ action }}</button>
            <a href="{% url 'group_list' %}" class="btn btn-outline">Скасувати</a>
        </div>
    </form>
</div>
{% endblock %}
