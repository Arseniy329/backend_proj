{% extends "base.html" %}

{% block title %}{{ action }} групу — EduPlatform{% endblock %}
{% block page_title %}{{ action }} групу{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px;">
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="name">Назва</label>
            <input type="text" id="name" name="name" class="form-control"
                   value="{{ group.name|default:'' }}" required>
        </div>
        <div class="form-group">
            <label for="branch">Гілка</label>
            <select id="branch" name="branch" class="form-control" required>
                <option value="">Оберіть гілку</option>
                {% for b in branches %}
                <option value="{{ b.pk }}" {% if group and group.branch_id == b.pk %}selected{% endif %}>{{ b.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="subjects">Предмети</label>
            <select id="subjects" name="subjects" class="form-control" multiple required style="height: 120px;">
                {% for s in subjects %}
                <option value="{{ s.pk }}" {% if group and s in group.subjects.all %}selected{% endif %}>{{ s.name }}</option>
                {% endfor %}
            </select>
            <small style="color:var(--text-muted)">Утримуйте Ctrl (або Cmd), щоб обрати декілька</small>
        </div>
        <div style="display:flex; gap:12px;">
            <button type="submit" class="btn btn-primary">{{ action }}</button>
            <a href="{% url 'group_list' %}" class="btn btn-outline">Скасувати</a>
        </div>
    </form>
</div>
{% endblock %}
