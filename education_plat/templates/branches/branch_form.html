{% extends "base.html" %}

{% block title %}{{ action }} гілку — EduPlatform{% endblock %}
{% block page_title %}{{ action }} гілку{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px;">
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="name">Назва</label>
            <input type="text" id="name" name="name" class="form-control" value="{{ branch.name|default:'' }}" required>
        </div>
        <div class="form-group">
            <label for="city">Місто</label>
            <input type="text" id="city" name="city" class="form-control" value="{{ branch.city|default:'' }}" required>
        </div>
        <div class="form-group">
            <label for="address">Адреса</label>
            <input type="text" id="address" name="address" class="form-control" value="{{ branch.address|default:'' }}">
        </div>
        <div class="form-group">
            <label for="country">Країна</label>
            <select id="country" name="country" class="form-control">
                <option value="">— Оберіть країну —</option>
                {% for c in countries %}
                <option value="{{ c.pk }}" {% if branch.country_id == c.pk %}selected{% endif %}>{{ c.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div style="display:flex; gap:12px;">
            <button type="submit" class="btn btn-primary">{{ action }}</button>
            <a href="{% url 'branch_list' %}" class="btn btn-outline">Скасувати</a>
        </div>
    </form>
</div>
{% endblock %}
