{% extends "base.html" %}

{% block title %}{{ action }} предмет — EduPlatform{% endblock %}
{% block page_title %}{{ action }} предмет{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px;">
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="name">Назва</label>
            <input type="text" id="name" name="name" class="form-control"
                   value="{{ subject.name|default:'' }}" required>
        </div>
        <div class="form-group">
            <label for="description">Опис</label>
            <textarea id="description" name="description" class="form-control">{{ subject.description|default:'' }}</textarea>
        </div>
        <div class="form-group">
            <label>Гілки</label>
            {% for b in branches %}
            <div style="margin-bottom:4px;">
                <label style="font-weight:normal; font-size:14px;">
                    <input type="checkbox" name="branches" value="{{ b.pk }}"
                           {% if subject and b in subject.branches.all %}checked{% endif %}>
                    {{ b.name }} ({{ b.city }})
                </label>
            </div>
            {% endfor %}
        </div>
        <div style="display:flex; gap:12px;">
            <button type="submit" class="btn btn-primary">{{ action }}</button>
            <a href="{% url 'subject_list' %}" class="btn btn-outline">Скасувати</a>
        </div>
    </form>
</div>
{% endblock %}
