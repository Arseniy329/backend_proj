{% extends "base.html" %}

{% block title %}Вхід — EduPlatform{% endblock %}

{% block body %}
<div class="login-wrapper">
    <div class="login-card">
        <h2>EduPlatform</h2>
        <p class="subtitle">Увійдіть за номером телефону</p>

        {% if messages %}
        <ul class="messages">
            {% for message in messages %}
            <li class="{{ message.tags }}">{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="phone">Номер телефону</label>
                <input type="text" id="phone" name="phone" class="form-control" placeholder="+380XXXXXXXXX" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Введіть пароль" required>
            </div>
            <button type="submit" class="btn btn-primary">Увійти</button>
        </form>
    </div>
</div>
{% endblock %}
